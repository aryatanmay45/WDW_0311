<body>
    <h1 align="middle">HOTEL ROOM BOOKIG FORM </h1>
    <Form action="#" method="post">
        <label for="name">Name</label>
     <input type="text" id="name" placeholder="Enter your name" required><br><br>
     <label for="email">Email</label>
     <input type="email" id="email" placeholder="Enter your email" required><br><br>
     <label for="phone">Phone</label>
     <input type="tel" id="phone" placeholder="Enter your phone number" required><br><br>
     <label for="check-in">Check-in Date</label>
     <input type="date" id="check-in" required><br><br>
     <label for="Check-out">Check-out Date</label>
     <input type="date" id="Check-out" required><br><br>
     <label for="roomtype">Room Type </label>
        <select id="roomtype">
            <option value="">choose Room </option>
            <option value="single">Single Room</option>
            <option value="double">Double Room</option>
        </select>
        <br><br>
        <label for="Guest">No. of Guests</label>
        <input type="number" id="Guest" min="1" max="10"><br><br>
        <label for="gender">Gender :</label>
        <input type="radio" id="male" name="gender" value="male" required>Male
        <input type="radio" id="female" name="gender" value="female" required>Female
        <input type="radio" id="other" name="gender" value="other" required>Other
        <br><br>
        <label for="specialrequest">Special Request</label><br>

        <input type="text" id="specialrequest" placeholder="Enter your request" rows= "10" cols= "50" required> <br><br><br>
    
        <input type="submit" value="Book Now">
        <input type="reset" value="Reset">
  </Form>
